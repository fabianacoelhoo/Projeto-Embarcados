<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar no EchoMap</title>
  <link rel="stylesheet" href="/tokens.css">
  <style>
    :root { color-scheme: light dark; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme]) { --bg: #0B0E14; --surface: #121722; --surface-2: #181F2E; --border: rgba(255,255,255,.08); --border-strong: rgba(255,255,255,.16); --text: #E6EAF2; --text-2: #A3ADBF; --primary: #6F8EF7; --primary-hover: #8AA3FA; --primary-soft: rgba(111,142,247,.12); --on-primary: #0B0E14; --crit: #FF8A80; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      background: var(--bg); color: var(--text); font: 16px/1.55 var(--font); -webkit-font-smoothing: antialiased; }
    main { width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 32px 28px; }
    .mark { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; letter-spacing: -0.02em; margin-bottom: 28px; }
    .mark svg { flex: none; }
    h1 { font-size: 23px; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 8px; line-height: 1.2; }
    p { margin: 0 0 24px; color: var(--text-2); font-size: 14px; }
    label { display: block; font-weight: 600; font-size: 13px; color: var(--text-2); margin-bottom: 6px; }
    input { width: 100%; font: 500 18px/1 var(--mono); letter-spacing: .06em; min-height: 48px; padding: 0 14px; border-radius: var(--r-md);
      border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); }
    input:focus-visible { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
    button:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    button { margin-top: 16px; width: 100%; font: 600 15px/1 var(--font); min-height: 48px; border: 0; border-radius: var(--r-md);
      background: var(--primary); color: var(--on-primary); cursor: pointer; }
    button:hover { background: var(--primary-hover); }
    button[disabled] { opacity: .6; cursor: progress; }
    .err { color: var(--crit); margin: 12px 0 0; font-size: 14px; min-height: 1.5em; }
    #userRow { margin-bottom: 16px; } #userRow[hidden] { display: none; }
  </style>
</head>
<body>
  <main>
    <div class="mark">
      <svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="3.5" fill="var(--primary)"/><path d="M9.5 9.5a9 9 0 0 0 0 13M22.5 9.5a9 9 0 0 1 0 13M5 5a15.5 15.5 0 0 0 0 22M27 5a15.5 15.5 0 0 1 0 22" fill="none" stroke="var(--primary)" stroke-width="2.2" stroke-linecap="round"/></svg>
      EchoMap
    </div>
    <h1>Entrar no painel</h1>
    <p>Este aparelho precisa da senha do painel. Ela aparece no terminal onde o servidor foi iniciado e na aba Dispositivo, no computador.</p>
    <form id="f">
      <div id="userRow" hidden>
        <label for="user">Usuário</label>
        <input id="user" type="text" autocomplete="username" autocapitalize="none" spellcheck="false">
      </div>
      <label for="pw">Senha do painel</label>
      <input id="pw" type="password" autocomplete="current-password" autocapitalize="none" spellcheck="false" required autofocus>
      <button id="go" type="submit">Entrar</button>
      <p class="err" id="err" role="alert"></p>
    </form>
  </main>
  <script>
    const f = document.getElementById('f'), err = document.getElementById('err'), go = document.getElementById('go');
    const userRow = document.getElementById('userRow'), user = document.getElementById('user');
    /* com DASHBOARD_USER configurado, o servidor pede também o usuário */
    fetch('/api/login-info').then((r) => r.json()).then((info) => {
      if (!info.userRequired) return;
      userRow.hidden = false; user.required = true; user.focus();
    }).catch(() => {});
    f.addEventListener('submit', async (e) => {
      e.preventDefault();
      go.disabled = true; err.textContent = '';
      try {
        const res = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ user: user.value.trim(), password: document.getElementById('pw').value }) });
        const body = await res.json().catch(() => ({}));
        if (res.ok) {
          const next = new URLSearchParams(location.search).get('next');
          location.replace(next && next.startsWith('/') && !next.startsWith('//') ? next : '/');
          return;
        }
        err.textContent = body.error || 'Não foi possível entrar.';
      } catch { err.textContent = 'Sem conexão com o servidor.'; }
      go.disabled = false;
    });
  </script>
</body>
</html>

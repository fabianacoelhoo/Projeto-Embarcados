<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="900" viewBox="0 0 1700 900" font-family="Inter, Arial, Helvetica, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker></defs>
<rect width="100%" height="100%" fill="#fff"/>
<text x="60" y="58" font-size="28" font-weight="700" fill="#1f2937">EchoMap — Arquitetura e fluxo de comunicação</text>
<text x="60" y="90" font-size="16" fill="#6b7280">Dado do sensor até o painel dos responsáveis · linhas cheias = implementado · tracejado = próxima etapa</text>
<line x1="60" y1="112" x2="1640" y2="112" stroke="#FF6000" stroke-width="3"/>
<rect x="60" y="140" width="470" height="700" rx="16" fill="#ea580c" fill-opacity="0.06" stroke="#ea580c" stroke-opacity="0.45" stroke-width="2"/>
<text x="80" y="172" font-size="15" font-weight="700" letter-spacing="1" fill="#ea580c">1 · DISPOSITIVO (EDGE)</text>
<rect x="600" y="140" width="520" height="700" rx="16" fill="#2563eb" fill-opacity="0.06" stroke="#2563eb" stroke-opacity="0.45" stroke-width="2"/>
<text x="620" y="172" font-size="15" font-weight="700" letter-spacing="1" fill="#2563eb">2 · SERVIDOR LOCAL (PC)</text>
<rect x="1190" y="140" width="450" height="700" rx="16" fill="#16a34a" fill-opacity="0.06" stroke="#16a34a" stroke-opacity="0.45" stroke-width="2"/>
<text x="1210" y="172" font-size="15" font-weight="700" letter-spacing="1" fill="#16a34a">3 · RESPONSÁVEIS</text>
<rect x="90" y="190" width="410" height="140" rx="10" fill="#fff" stroke="#ea580c" stroke-width="2"/>
<text x="106" y="218" font-size="16" font-weight="700" fill="#1f2937">Sensores e atuadores</text>
<text x="106" y="242" font-size="13" fill="#6b7280">2× HC-SR04 (esquerdo / direito)</text>
<text x="106" y="261" font-size="13" fill="#6b7280">Potenciômetro (limiar 20–200 cm) · Botão</text>
<text x="106" y="280" font-size="13" fill="#6b7280">LED RGB + 2 buzzers passivos</text>
<rect x="90" y="366" width="410" height="200" rx="10" fill="#fff" stroke="#ea580c" stroke-width="2"/>
<text x="106" y="394" font-size="16" font-weight="700" fill="#1f2937">ESP32 · FreeRTOS (5 tasks)</text>
<text x="106" y="418" font-size="13" fill="#6b7280">Core 1: TaskSensors · TaskStatusLed · TaskBuzzer</text>
<text x="106" y="437" font-size="13" fill="#6b7280">Core 0: TaskButton · TaskComms</text>
<text x="106" y="456" font-size="13" fill="#6b7280">Filtro EMA + histerese, anti-eco cruzado</text>
<text x="106" y="475" font-size="13" fill="#6b7280">Eventos NEAR_MISS (&lt; 50 cm) e CRASH</text>
<text x="106" y="494" font-size="13" fill="#6b7280">JSON a cada 200 ms</text>
<rect x="90" y="602" width="410" height="90" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2" stroke-dasharray="8 6"/>
<text x="106" y="630" font-size="16" font-weight="700" fill="#1f2937">GPS NEO-6M · MPU-6050</text>
<text x="106" y="654" font-size="13" fill="#6b7280">localização · queda / impacto (ainda não ligados)</text>
<rect x="90" y="720" width="410" height="96" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/>
<text x="106" y="748" font-size="16" font-weight="700" fill="#1f2937">Transporte</text>
<text x="106" y="772" font-size="13" fill="#6b7280">MQTT sobre Wi-Fi 2,4 GHz (TCP :1883)</text>
<text x="106" y="791" font-size="13" fill="#6b7280">ou USB Serial 115200 · payload JSON</text>
<path d="M295,330 L295,364" fill="none" stroke="#374151" stroke-width="2.5" marker-end="url(#ar)"/>
<path d="M295,602 L295,568" fill="none" stroke="#d97706" stroke-width="2.5" stroke-dasharray="9 7" marker-end="url(#arp)"/>
<rect x="630" y="190" width="460" height="110" rx="10" fill="#fff" stroke="#2563eb" stroke-width="2"/>
<text x="646" y="218" font-size="16" font-weight="700" fill="#1f2937">Broker MQTT embutido (Aedes)</text>
<text x="646" y="242" font-size="13" fill="#6b7280">porta 1883 · echomap/&lt;id&gt;/&lt;canal&gt;</text>
<text x="646" y="261" font-size="13" fill="#6b7280">ou broker externo (MQTT_URL)</text>
<rect x="630" y="336" width="460" height="184" rx="10" fill="#fff" stroke="#2563eb" stroke-width="2"/>
<text x="646" y="364" font-size="16" font-weight="700" fill="#1f2937">Back-end Node.js</text>
<text x="646" y="388" font-size="13" fill="#6b7280">Express (API REST) + WebSocket /ws</text>
<text x="646" y="407" font-size="13" fill="#6b7280">hub.js: normaliza leituras e gera eventos</text>
<text x="646" y="426" font-size="13" fill="#6b7280">Regras: zona segura, impacto, bateria,</text>
<text x="646" y="445" font-size="13" fill="#6b7280">dispositivo offline</text>
<text x="646" y="464" font-size="13" fill="#6b7280">Fonte alternativa: Serial (serialport)</text>
<rect x="630" y="556" width="460" height="96" rx="10" fill="#fff" stroke="#2563eb" stroke-width="2"/>
<text x="646" y="584" font-size="16" font-weight="700" fill="#1f2937">SQLite (node:sqlite)</text>
<text x="646" y="608" font-size="13" fill="#6b7280">devices · readings · events</text>
<text x="646" y="627" font-size="13" fill="#6b7280">leituras 1×/s · retenção de 30 dias</text>
<rect x="630" y="690" width="460" height="120" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/>
<text x="646" y="718" font-size="16" font-weight="700" fill="#1f2937">Simulador da ESP32 (tools/simulator.js)</text>
<text x="646" y="742" font-size="13" fill="#6b7280">publica no broker o mesmo JSON do firmware</text>
<text x="646" y="761" font-size="13" fill="#6b7280">para testar o painel sem a placa</text>
<path d="M860,300 L860,334" fill="none" stroke="#374151" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="872" y="322" font-size="12" fill="#6b7280">subscribe echomap/#</text>
<path d="M860,520 L860,554" fill="none" stroke="#374151" stroke-width="2.5" marker-end="url(#ar)" marker-start="url(#ar)"/>
<rect x="1220" y="190" width="390" height="280" rx="10" fill="#fff" stroke="#16a34a" stroke-width="2"/>
<text x="1236" y="218" font-size="16" font-weight="700" fill="#1f2937">Dashboard web (navegador)</text>
<text x="1236" y="242" font-size="13" fill="#6b7280">HTML/CSS/JS + Leaflet (mapa)</text>
<text x="1236" y="261" font-size="13" fill="#6b7280">• Ao redor agora (esq./dir.)</text>
<text x="1236" y="280" font-size="13" fill="#6b7280">• Gráfico de distância + limiar</text>
<text x="1236" y="299" font-size="13" fill="#6b7280">• Ocorrências com “Ciente”</text>
<text x="1236" y="318" font-size="13" fill="#6b7280">• Localização e zona segura</text>
<text x="1236" y="337" font-size="13" fill="#6b7280">• Queda, impacto e bateria</text>
<text x="1236" y="356" font-size="13" fill="#6b7280">• Notificações do navegador</text>
<rect x="1220" y="506" width="390" height="110" rx="10" fill="#fff" stroke="#16a34a" stroke-width="2"/>
<text x="1236" y="534" font-size="16" font-weight="700" fill="#1f2937">Responsáveis</text>
<text x="1236" y="558" font-size="13" fill="#6b7280">pais/cuidadores de crianças,</text>
<text x="1236" y="577" font-size="13" fill="#6b7280">idosos ou pessoas vulneráveis</text>
<rect x="1220" y="656" width="390" height="124" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2" stroke-dasharray="8 6"/>
<text x="1236" y="684" font-size="16" font-weight="700" fill="#1f2937">Comandos ao dispositivo</text>
<text x="1236" y="708" font-size="13" fill="#6b7280">POST /api/devices/:id/command</text>
<text x="1236" y="727" font-size="13" fill="#6b7280">→ echomap/&lt;id&gt;/cmd (ex.: tocar buzzer)</text>
<path d="M1415,470 L1415,504" fill="none" stroke="#374151" stroke-width="2.5" marker-end="url(#ar)" marker-start="url(#ar)"/>
<path d="M502,410 L560,410 L560,250 L628,250" fill="none" stroke="#374151" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="531" y="400" font-size="12" text-anchor="middle" font-weight="600" fill="#1f2937">publish</text>
<text x="552" y="352" font-size="12" text-anchor="end" fill="#1f2937">telemetry · events</text>
<path d="M628,280 L585,280 L585,500 L502,500" fill="none" stroke="#d97706" stroke-width="2.5" stroke-dasharray="9 7" marker-end="url(#arp)"/>
<text x="543" y="490" font-size="12" text-anchor="middle" font-weight="600" fill="#b45309">…/cmd</text>
<path d="M1092,380 L1218,380" fill="none" stroke="#374151" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="1155" y="368" font-size="12" text-anchor="middle" font-weight="600" fill="#1f2937">WebSocket</text>
<path d="M1092,440 L1218,440" fill="none" stroke="#374151" stroke-width="2.5" marker-end="url(#ar)" marker-start="url(#ar)"/>
<text x="1155" y="428" font-size="12" text-anchor="middle" font-weight="600" fill="#1f2937">REST /api</text>
<path d="M1218,718 L1160,718 L1160,490 L1092,490" fill="none" stroke="#d97706" stroke-width="2.5" stroke-dasharray="9 7" marker-end="url(#arp)"/>
<text x="1153" y="620" font-size="12" text-anchor="end" font-weight="600" fill="#b45309">comando</text>
</svg>